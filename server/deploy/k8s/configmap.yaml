apiVersion: v1
kind: ConfigMap
metadata:
  name: dhp-registry-config
  namespace: dhp
data:
  config.yaml: |
    listen: ":8080"
    storage:
      type: local
      config:
        path: /var/lib/dhp/artifacts
    ai_judge:
      endpoint: ""
      model: ""
    rules:
      enabled:
        - schema_valid
        - slug_unique
        - dangerous_permissions
        - sensitive_categories
      sensitive_keywords:
        - financial advice
        - medical diagnosis
        - election
    auth:
      type: token
      # Replace via kustomize secretGenerator or a separate Secret in production.
      token: "replace-me"
    registry_url: "https://openkursar.github.io/digital-human-protocol"
    request_timeout: 60s
    max_upload_bytes: 26214400
